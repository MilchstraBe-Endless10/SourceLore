name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify single-source version consistency
        run: |
          python3 - <<'PY'
          import re, pathlib
          v = pathlib.Path("src/skill_interface/version.py").read_text()
          m = re.search(r'RELEASE_VERSION\s*=\s*["\']([^"\']+)', v)
          assert m, "RELEASE_VERSION missing"
          print("version:", m.group(1))
          assert re.match(r'^\d+\.\d+\.\d+', m.group(1)), "not semver-like"
          PY

      - name: Skill entry and metadata checks
        run: |
          test -f skill/sourcelore/SKILL.md
          test -f skill/sourcelore/scripts/sourcelore.py
          python3 - <<'PY'
          from pathlib import Path
          text = Path("skill/sourcelore/SKILL.md").read_text(encoding="utf-8")
          assert "name:" in text and "description:" in text, "frontmatter missing"
          print("SKILL.md frontmatter ok")
          PY

      - name: CLI smoke (standard library only)
        env:
          SOURCELORE_PROJECT_ROOT: ${{ github.workspace }}
          SOURCELORE_DATA_ROOT: ${{ runner.temp }}/sl-data
        run: |
          python3 skill/sourcelore/scripts/sourcelore.py --version
          python3 skill/sourcelore/scripts/sourcelore.py --help
          python3 skill/sourcelore/scripts/sourcelore.py status

      - name: Install optional JS/TS parser dependencies (isolated venv)
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/pip install -r requirements-treesitter.txt

      - name: Run test suite (standalone scripts, per-file)
        env:
          SOURCELORE_DATA_ROOT: ${{ runner.temp }}/sl-data
        run: |
          set -u
          REPO="$(pwd)"
          SRC="$REPO/src"
          SP="$(pwd)/.ci-venv/lib/$(python3 -c 'import sys;print("python%d.%d"%sys.version_info[:2])')/site-packages"
          fail=0; total=0
          while IFS= read -r f; do
            # Machine-local integration tests: these require the author's real
            # installed Skill at ~/.agents/skills/sourcelore (byte-identical to
            # source, sibling skills, non-/tmp marker) or a pre-seeded kb.db.
            # Verified locally against the real environment; a clean CI runner
            # cannot satisfy them without faking the author's home, so they are
            # excluded here and run in the release-host verification instead.
            case "$f" in
              tests/skill_interface/test_knowledge_answer.py|tests/trust/test_p0_trust.py|\
              tests/p6f_capture/test_installed_cli.py|tests/skill_interface/test_authenticated_github.py|\
              tests/skill_interface/test_cli.py|tests/skill_interface/test_harness_invocation.py) continue;;
            esac
            total=$((total+1))
            d=$(dirname "$f"); b=$(basename "$f")
            (cd "$d" && PYTHONPATH="$SRC:$SP" SOURCELORE_DATA_ROOT="$SOURCELORE_DATA_ROOT" \
              "$REPO/.ci-venv/bin/python" "$b") || { echo "FAIL $f"; fail=1; }
          done < <(find tests -name 'test_*.py' -type f | sort)
          echo "ran $total test files"
          exit "$fail"

      - name: Build release ZIP and verify manifest
        run: |
          python3 tools/build_release.py --out dist
          cd dist && sha256sum -c SHA256SUMS.txt
          test -f RELEASE_INFO.json

      - name: Standalone ZIP install test (data root isolation)
        env:
          TMPD: ${{ runner.temp }}
        run: |
          set -e
          S="$TMPD/skilldir"; D="$TMPD/sldata"
          python3 tools/install.py install --zip dist/*.zip --skill-dir "$S"
          env -u SOURCELORE_PROJECT_ROOT SOURCELORE_DATA_ROOT="$D" \
            python3 "$S/scripts/sourcelore.py" --version
          # Deleting build artifacts must not break the installed Skill.
          rm -rf dist
          env -u SOURCELORE_PROJECT_ROOT SOURCELORE_DATA_ROOT="$D" \
            python3 "$S/scripts/sourcelore.py" --version
          python3 tools/install.py doctor --skill-dir "$S" --json

      - name: Standalone ZIP self-bootstrap (no repo checkout, no --source)
        env:
          TMPD: ${{ runner.temp }}
        run: |
          set -e
          B="$TMPD/bootstrap"; mkdir -p "$B"
          # Build a fresh ZIP here: an earlier step may have removed dist/.
          python3 tools/build_release.py --out "$B/dist"
          # Extract the ZIP and run the installer that ships INSIDE it.
          python3 - "$B" <<'PY'
          import glob, os, sys, zipfile
          z = glob.glob(os.path.join(sys.argv[1], "dist", "*.zip"))[0]
          zipfile.ZipFile(z).extractall(os.path.join(sys.argv[1], "x"))
          PY
          BOOT="$B/x/sourcelore/install.py"
          test -f "$BOOT"
          HOME="$B/home" SOURCELORE_DATA_ROOT="$B/data" \
            python3 "$BOOT" install
          # An uninitialized data root must NOT be reported as an install failure.
          HOME="$B/home" SOURCELORE_DATA_ROOT="$B/data" \
            python3 "$BOOT" doctor --json
          # Deleting the ZIP and extraction dir must not break the installed Skill.
          rm -rf "$B/dist" "$B/x"
          HOME="$B/home" SOURCELORE_DATA_ROOT="$B/data" \
            python3 "$B/home/.agents/skills/sourcelore/scripts/sourcelore.py" --version

      - name: License and notice checks
        run: |
          test -f LICENSE
          grep -q "MIT License" LICENSE
          test -f THIRD_PARTY_NOTICES.md

      - name: Documentation link sanity
        run: |
          python3 - <<'PY'
          import pathlib, re
          missing = []
          for md in list(pathlib.Path("docs").rglob("*.md")) + [pathlib.Path("README.md"), pathlib.Path("README.zh-CN.md")]:
              text = md.read_text(encoding="utf-8", errors="ignore")
              for link in re.findall(r'\]\(([^)]+)\)', text):
                  if link.startswith(("http://", "https://", "#", "mailto:")):
                      continue
                  # Skip prose placeholders, not real file links.
                  if link.strip().upper() in {"URL", "TODO", "TBD", "N/A", "PATH", "XXX"}:
                      continue
                  target = (md.parent / link.split("#")[0]).resolve()
                  if not target.exists():
                      missing.append((str(md), link))
          if missing:
              for m, l in missing[:20]:
                  print("BROKEN", m, "->", l)
              raise SystemExit(1)
          print("all doc links resolve")
          PY
