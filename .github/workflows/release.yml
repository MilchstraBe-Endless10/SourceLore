name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify tag matches single-source version
        run: |
          python3 - <<'PY'
          import re, pathlib, os
          v = pathlib.Path("src/skill_interface/version.py").read_text()
          release = re.search(r'RELEASE_VERSION\s*=\s*["\']([^"\']+)', v).group(1)
          tag = os.environ["GITHUB_REF_NAME"]
          assert tag == "v" + release, f"tag {tag} != v{release}"
          print("tag/version aligned:", tag)
          PY
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Run full test suite
        env:
          PYTHONPATH: src
          SOURCELORE_DATA_ROOT: ${{ runner.temp }}/sl-data
        run: |
          fail=0
          while IFS= read -r f; do
            d=$(dirname "$f"); b=$(basename "$f")
            (cd "$d" && python3 "$b") || fail=1
          done < <(find tests -name 'test_*.py' -type f | sort)
          exit "$fail"

      - name: Build and verify artifacts
        run: |
          python3 tools/build_release.py --out dist
          cd dist && sha256sum -c SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/RELEASE_INFO.json
