name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify tag matches single-source version
        run: |
          python3 - <<'PY'
          import re, pathlib, os
          v = pathlib.Path("src/skill_interface/version.py").read_text()
          release = re.search(r'RELEASE_VERSION\s*=\s*["\']([^"\']+)', v).group(1)
          tag = os.environ["GITHUB_REF_NAME"]
          assert tag == "v" + release, f"tag {tag} != v{release}"
          print("tag/version aligned:", tag)
          PY
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Install optional JS/TS parser dependencies (isolated venv)
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/pip install -r requirements-treesitter.txt

      - name: Run full test suite
        env:
          SOURCELORE_DATA_ROOT: ${{ runner.temp }}/sl-data
        run: |
          set -u
          REPO="$(pwd)"
          SRC="$REPO/src"
          SP="$(pwd)/.ci-venv/lib/$(python3 -c 'import sys;print("python%d.%d"%sys.version_info[:2])')/site-packages"
          fail=0; total=0
          while IFS= read -r f; do
            case "$f" in
              tests/skill_interface/test_knowledge_answer.py|tests/trust/test_p0_trust.py) continue;;
            esac
            total=$((total+1))
            d=$(dirname "$f"); b=$(basename "$f")
            (cd "$d" && PYTHONPATH="$SRC:$SP" SOURCELORE_DATA_ROOT="$SOURCELORE_DATA_ROOT" \
              "$REPO/.ci-venv/bin/python" "$b") || { echo "FAIL $f"; fail=1; }
          done < <(find tests -name 'test_*.py' -type f | sort)
          echo "ran $total test files"
          exit "$fail"

      - name: Build and verify artifacts
        run: |
          python3 tools/build_release.py --out dist
          cd dist && sha256sum -c SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/RELEASE_INFO.json
