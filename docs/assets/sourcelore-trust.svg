<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 545" width="1460" height="545" role="img" aria-label="SourceLore trust and integrity"><title>SourceLore trust and integrity</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#F8FAFF"/><stop offset="1" stop-color="#EFF1FF"/></linearGradient><linearGradient id="accent"><stop stop-color="#2563EB"/><stop offset="1" stop-color="#7C3AED"/></linearGradient></defs><rect width="1460" height="545" rx="26" fill="url(#bg)"/><g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="59" y="75" font-size="43" fill="#14244B" font-weight="760" text-anchor="start">Trust &amp; evidence model</text><text x="60" y="112" font-size="20" fill="#64748B" font-weight="500" text-anchor="start">Answers inherit the limits of provenance, completeness, and review status</text>
<rect x="49" y="177" width="442" height="254" rx="18" fill="#FFFFFF" stroke="#C9D7F6" stroke-width="2"/><text x="73" y="225" font-size="30" fill="#2563EB" font-weight="750" text-anchor="start">Repository identity</text><text x="73" y="291" font-size="20" fill="#293A63" font-weight="500" text-anchor="start">•  Repository + verified Commit</text><text x="73" y="334" font-size="20" fill="#293A63" font-weight="500" text-anchor="start">•  Cross-repository isolation</text><text x="73" y="377" font-size="20" fill="#293A63" font-weight="500" text-anchor="start">•  ROOT_ONLY scope visible</text><rect x="521" y="177" width="442" height="254" rx="18" fill="#FFFFFF" stroke="#C9D7F6" stroke-width="2"/><text x="545" y="225" font-size="30" fill="#7C3AED" font-weight="750" text-anchor="start">Evidence integrity</text><text x="545" y="291" font-size="20" fill="#293A63" font-weight="500" text-anchor="start">•  Only current-view assets</text><text x="545" y="334" font-size="20" fill="#293A63" font-weight="500" text-anchor="start">•  Evidence must be locatable</text><text x="545" y="377" font-size="20" fill="#293A63" font-weight="500" text-anchor="start">•  Invalid negatives rejected</text><rect x="993" y="177" width="442" height="254" rx="18" fill="#FFFFFF" stroke="#C9D7F6" stroke-width="2"/><text x="1017" y="225" font-size="30" fill="#2563EB" font-weight="750" text-anchor="start">Answer quality</text><text x="1017" y="291" font-size="20" fill="#293A63" font-weight="500" text-anchor="start">•  Source and commit links</text><text x="1017" y="334" font-size="20" fill="#293A63" font-weight="500" text-anchor="start">•  Review status stays explicit</text><text x="1017" y="377" font-size="20" fill="#293A63" font-weight="500" text-anchor="start">•  No invented runtime proof</text>
<rect x="280" y="467" width="900" height="53" rx="18" fill="#ECEFFF" stroke="#D6DBFC" stroke-width="2"/><text x="730" y="501" font-size="21" fill="#505CA6" font-weight="700" text-anchor="middle">Fact     →     Claim     →     Verification     →     Evidence     →     Answer</text></g></svg>